{% extends "base.html" %}

{% block content %}
<body>
    <h2>Forgot your password?</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="email">Enter your email:</label><br>
        <input type="email" name="email" required><br><br>
        <button type="submit">Send Reset Link</button>
    </form>
</body>
{% endblock %}
